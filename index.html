<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScootNav">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>ScootNav Boston (v0.1 draft)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0f1419;--panel:#1a222c;--line:#2e3a48;--text:#e8eef4;--muted:#8b9aab;--accent:#22c55e;--blue:#3d8bfd;--warn:#f5c542}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif}
#map{position:absolute;inset:0}
#top{position:absolute;top:0;left:0;right:0;z-index:1000;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(var(--bg) 70%,transparent)}
#search{display:flex;gap:6px}
#search input{flex:1;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
button{font-size:16px;padding:12px 14px;border-radius:12px;border:none;background:var(--accent);color:#06210f;font-weight:700}
button.sec{background:var(--panel);color:var(--text);border:1px solid var(--line);font-weight:600}
#banner{display:none;margin-top:8px;background:var(--accent);color:#06210f;border-radius:14px;padding:12px 14px}
#banner .dist{font-size:30px;font-weight:800;line-height:1}
#banner .instr{font-size:20px;font-weight:700;margin-top:4px}
#banner .then{font-size:14px;opacity:.8;margin-top:4px}
#banner.rr{background:var(--warn);color:#2a1f00}
#bottom{position:absolute;bottom:0;left:0;right:0;z-index:1000;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(transparent,var(--bg) 30%)}
#stats{font-size:15px;margin-bottom:6px}
#row{display:flex;gap:6px;flex-wrap:wrap}
#row button{padding:10px 12px;font-size:15px}
#bottom{background:linear-gradient(transparent,rgba(15,20,25,.92) 25%)}
.on{background:var(--accent)!important;color:#06210f!important}
#rate{display:none;position:absolute;left:10px;right:10px;bottom:120px;z-index:1100;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
#rate .big{font-size:34px;padding:10px 22px;margin:8px}
#logp{display:none;position:absolute;left:10px;right:10px;bottom:120px;z-index:1100;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14px}
#note{font-size:11px;color:var(--muted);margin-top:6px}
#hint{font-size:13px;color:var(--muted);margin-top:6px}
.legend{font-size:11px;color:var(--muted);display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
.sw{display:inline-block;width:14px;height:4px;vertical-align:middle;margin-right:3px;border-radius:2px}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <div id="search">
    <input id="dest" placeholder="Where to? (paste an address or tap the map)" autocomplete="off" enterkeyhint="go">
    <button id="go">Go</button>
  </div>
  <div id="hint">Start = your GPS. Paste a Boston, Cambridge or Brookline address, or tap the map.</div>
  <div id="banner"><div class="dist" id="bdist"></div><div class="instr" id="binstr"></div><div class="then" id="bthen"></div></div>
</div>
<div id="rate"><div style="font-size:18px;font-weight:700">How was that route?</div><button class="sec big" id="up">👍</button><button class="sec big" id="down">👎</button><div><button class="sec" id="skip" style="margin-top:4px">Skip</button></div></div>
<div id="logp"><div id="logsum"></div><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button id="exp">Export JSON</button><button class="sec" id="clr">Clear log</button><button class="sec" id="logx">Close</button></div></div>
<div id="bottom">
  <div id="stats"></div>
  <div id="row">
    <button id="start" class="sec" style="display:none">Start ride</button>
    <button id="end" class="sec" style="display:none">End leg</button>
    <button id="mode" class="sec">Scooter</button>
    <button id="voice" class="sec">Voice off</button>
    <button id="layer" class="sec">Lanes</button>
    <button id="log" class="sec">Log</button>
    <button id="sim" class="sec" style="display:none">Sim ride</button>
    <button id="miss" class="sec" style="display:none">Sim missed turn</button>
  </div>
  <div class="legend" id="legend" style="display:none"><span><i class="sw" style="background:#22c55e"></i>separated or path</span><span><i class="sw" style="background:#60a5fa"></i>painted lane</span><span><i class="sw" style="background:#a3a3a3"></i>shared lane</span><span><i class="sw" style="background:#f472b6"></i>contraflow (city data)</span></div>
  <div id="note"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BR='https://brouter.de/brouter', NAMES='https://routing.openstreetmap.de/routed-bike/nearest/v1/driving/';
const OFF_ROUTE_M=40, ADVANCE_M=18, AHEAD_M=15, PROFILE_VER='c4';
const AREA=L.latLngBounds([42.29,-71.18],[42.41,-71.03]), HOME=L.latLngBounds([42.31,-71.13],[42.375,-71.07]);
const qs=new URLSearchParams(location.search), SIM=qs.has('sim');
const map=L.map('map',{zoomControl:false,maxBounds:AREA.pad(0.05),maxBoundsViscosity:0.8,minZoom:12}).fitBounds(HOME);
L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',{maxZoom:20,subdomains:'abc',attribution:'&copy; OpenStreetMap contributors · CyclOSM · routing BRouter'}).addTo(map);
const $=id=>document.getElementById(id);
let me=null,meMarker=null,dest=null,destMarker=null,route=null,routeLine=null,steps=[],si=0,riding=false,offCount=0,rerouting=false,voiceOn=false,heading=null,simTimer=null,lastSpoken='';
let mode=localStorage.getItem('sn_mode')||'scooter', leg=null;
const NOTE={scooter:'Scooter mode: streets, bike lanes and street-side cycle tracks. No paths, no sidewalks, no contraflow.',ebike:'E-bike mode: adds bike paths and signed contraflow lanes. No sidewalks.'};
function paintMode(){$('mode').textContent=mode==='scooter'?'Scooter':'E-bike';$('note').textContent='Draft v0.1 · '+NOTE[mode]}
paintMode();
// ---- profiles (keyless BRouter custom profiles, uploaded on load) ----
let profiles=JSON.parse(localStorage.getItem('sn_prof_'+PROFILE_VER)||'null'), profText=null;
async function uploadProfiles(){profText=profText||await (await fetch('profile/courier.brf')).text();
  const up=async t=>(await (await fetch(BR+'/profile',{method:'POST',headers:{'Content-Type':'text/plain'},body:t})).json()).profileid;
  profiles={scooter:await up(profText),ebike:await up(profText.replace('assign scooter = true','assign scooter = false'))};
  localStorage.setItem('sn_prof_'+PROFILE_VER,JSON.stringify(profiles));return profiles}
const profReady=profiles?Promise.resolve(profiles):uploadProfiles();
// ---- lanes overlay ----
const colorFor=f=>(/^CF|^CT/.test(f)?'#f472b6':/^(SBL|BSBL|BFBL|SUP|SUB|CTBL|SLB|PBL)/.test(f)?'#22c55e':f==='BL'||f==='BBL'?'#60a5fa':'#a3a3a3');
let lanes=null;fetch('bikenet.json').then(r=>r.json()).then(g=>{lanes=L.geoJSON(g,{style:ft=>({color:colorFor(ft.properties.f),weight:4,opacity:.7})})});
$('layer').onclick=()=>{if(!lanes)return;const on=!map.hasLayer(lanes);on?lanes.addTo(map):map.removeLayer(lanes);$('layer').classList.toggle('on',on);$('legend').style.display=on?'flex':'none';routeLine&&routeLine.bringToFront()};
$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').textContent=voiceOn?'Voice on':'Voice off';if(voiceOn)say('Voice on')};
function say(t){if(!voiceOn||!window.speechSynthesis||t===lastSpoken)return;lastSpoken=t;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}
$('mode').onclick=()=>{mode=mode==='scooter'?'ebike':'scooter';localStorage.setItem('sn_mode',mode);paintMode();if(leg)leg.mode_switches=(leg.mode_switches||0)+1;if(dest)plan(riding?'mode':false)};
// ---- geo helpers ----
const R=6371000,rad=x=>x*Math.PI/180;
function hav(a,b){const dLat=rad(b[0]-a[0]),dLon=rad(b[1]-a[1]);const h=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function segProj(p,a,b){const k=Math.cos(rad(p[0]));const ax=a[1]*k,ay=a[0],bx=b[1]*k,by=b[0],px=p[1]*k,py=p[0];const dx=bx-ax,dy=by-ay;let t=((px-ax)*dx+(py-ay)*dy)/((dx*dx+dy*dy)||1e-12);t=Math.max(0,Math.min(1,t));return [hav(p,[ay+t*dy,(ax+t*dx)/k]),t]}
function nearestOnRoute(p){let m=1e9,bi=0,bt=0;const c=route.ll;for(let i=1;i<c.length;i++){const [d,t]=segProj(p,c[i-1],c[i]);if(d<m){m=d;bi=i;bt=t}}return {d:m,i:bi,t:bt}}
function remaining(p){const n=nearestOnRoute(p),c=route.ll;let r=hav(c[n.i-1],c[n.i])*(1-n.t);for(let i=n.i+1;i<c.length;i++)r+=hav(c[i-1],c[i]);return r}
function ahead(p,h,m){const a=rad(h);return [p[0]+m*Math.cos(a)/111320,p[1]+m*Math.sin(a)/(111320*Math.cos(rad(p[0])))]}
function fmt(m){return m<160?Math.round(m/5)*5+' m':(m/1609).toFixed(m<1609?2:1)+' mi'}
// ---- turn text from BRouter voice hints ----
const CMD={1:'Continue straight',2:'Turn left',3:'Bear left',4:'Sharp left',5:'Turn right',6:'Bear right',7:'Sharp right',8:'Keep left',9:'Keep right',10:'Make a U-turn',11:'Make a U-turn',12:'Make a U-turn'};
function instr(s){if(s.arrive)return 'Arrive at destination';const n=s.name?' onto '+s.name:'';
  if(s.cmd>=13)return 'At the roundabout, take exit '+(s.exit||1)+n;return (CMD[s.cmd]||(s.angle<0?'Turn left':'Turn right'))+n}
const nameCache={};
async function fillNames(st,c){for(const s of st){if(s.arrive)continue;const q=c[Math.min(s.idx+2,c.length-1)],k=q[0].toFixed(5)+','+q[1].toFixed(5);
  try{if(!(k in nameCache)){const j=await (await fetch(NAMES+q[1]+','+q[0]+'?number=1')).json();const nm=j.waypoints?.[0]?.name||'';nameCache[k]=/^Public Alley/.test(nm)?'':nm}s.name=nameCache[k];if(riding&&st===steps)tick()}catch(e){}}}
// ---- leg log ----
const LOG='sn_legs';const legs=()=>JSON.parse(localStorage.getItem(LOG)||'[]');
function saveLeg(){if(!leg)return;const L2=legs().filter(x=>x.id!==leg.id);L2.push(leg);localStorage.setItem(LOG,JSON.stringify(L2))}
function newLeg(){if(leg&&!leg.t_end)return;leg={id:Date.now().toString(36),app:'scootnav v0.1',mode,t_input:null,dest_query:null,dest:null,t_route_ready:null,t_start:null,handoff_s:null,route_m:null,reroutes:[],t_end:null,arrived:null,rating:null}}
const iso=()=>new Date().toISOString();
['paste','input'].forEach(ev=>$('dest').addEventListener(ev,()=>{newLeg();if(!leg.t_input)leg.t_input=iso()}));
// ---- destination ----
async function geocode(q){const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&bounded=1&viewbox=-71.18,42.41,-71.03,42.29&q='+encodeURIComponent(q);const r=await fetch(u);const j=await r.json();return j[0]?[+j[0].lat,+j[0].lon]:null}
function setDest(ll,q){newLeg();if(!leg.t_input)leg.t_input=iso();leg.dest_query=q||'map tap';leg.dest=ll.map(x=>+x.toFixed(5));dest=ll;if(destMarker)destMarker.setLatLng(ll);else destMarker=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#ef4444',fillOpacity:1}).addTo(map);plan()}
$('go').onclick=async()=>{const q=$('dest').value.trim();if(!q)return;$('hint').style.display='';$('hint').textContent='Finding '+q+'…';const ll=await geocode(q);if(!ll){$('hint').textContent='No match in the area. Try a street address, or tap the map.';return}setDest(ll,q)};
$('dest').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
map.on('click',e=>{if(!riding)setDest([e.latlng.lat,e.latlng.lng])});
// ---- position ----
function setMe(ll,hdg){me=ll;if(hdg!=null&&!isNaN(hdg))heading=hdg;if(meMarker)meMarker.setLatLng(ll);else meMarker=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#3d8bfd',fillOpacity:1}).addTo(map);if(riding)tick()}
if(!SIM&&navigator.geolocation){navigator.geolocation.watchPosition(p=>setMe([p.coords.latitude,p.coords.longitude],p.coords.heading),e=>{$('hint').textContent='Location is off. Allow location for this site in Settings, or add ?sim=1 to demo.'},{enableHighAccuracy:true,maximumAge:1000})}
if(SIM){setMe([+(qs.get('lat')||42.34668),+(qs.get('lon')||-71.09725)]);['sim','miss'].forEach(i=>$(i).style.display='')}
// ---- routing ----
async function fetchRoute(from,to,retry){const pr=await profReady;const u=BR+'?lonlats='+from[1].toFixed(6)+','+from[0].toFixed(6)+'|'+to[1].toFixed(6)+','+to[0].toFixed(6)+'&profile='+pr[mode]+'&alternativeidx=0&format=geojson&timode=2';
  const r=await fetch(u);const t=await r.text();
  if(!r.ok||t[0]!=='{'){if(!retry&&/profile/i.test(t)){await uploadProfiles();return fetchRoute(from,to,true)}throw new Error(t.slice(0,160))}
  return JSON.parse(t).features[0]}
async function plan(why){if(!me){$('hint').textContent='Waiting for GPS…';return}if(!dest)return;
  const t0=performance.now(),oldRem=(why&&route)?remaining(me):null,offBy=(why&&route)?Math.round(nearestOnRoute(me).d):null;
  // reroute: start a few metres ahead on the current heading so the router does not send you back the way you came
  const from=(why==='off'&&heading!=null)?ahead(me,heading,AHEAD_M):me;
  let f;try{f=await fetchRoute(from,dest)}catch(e){try{if(from!==me)f=await fetchRoute(me,dest)}catch(e2){}}
  rerouting=false;
  if(!f){$('hint').style.display='';$('hint').textContent='No '+(mode==='scooter'?'scooter-legal':'e-bike')+' route found. Try another spot'+(mode==='scooter'?' or E-bike mode.':'.');return}
  const c=f.geometry.coordinates.map(x=>[x[1],x[0]]);if(from!==me)c.unshift(me);
  const len=+f.properties['track-length'];
  route={ll:c,len};
  steps=(f.properties.voicehints||[]).filter(v=>v[1]!==1).map(v=>({idx:v[0]+(from!==me?1:0),cmd:v[1],exit:v[2],angle:v[4]})).map(s=>({...s,loc:c[Math.min(s.idx,c.length-1)]}));
  steps.push({arrive:true,loc:c[c.length-1],idx:c.length-1});si=0;offCount=0;fillNames(steps,c);
  if(routeLine)routeLine.setLatLngs(c);else routeLine=L.polyline(c,{color:'#22c55e',weight:7,opacity:.95}).addTo(map);routeLine.setStyle({color:mode==='scooter'?'#22c55e':'#a78bfa'});routeLine.bringToFront();
  const ms=Math.round(performance.now()-t0);
  if(leg){leg.mode=mode;if(!why){leg.t_route_ready=iso();leg.route_m=Math.round(len);leg.route_ms=ms}else if(why==='off'){leg.reroutes.push({t:iso(),off_route_m:offBy,latency_ms:ms,new_route_m:Math.round(len),added_m:oldRem!=null?Math.round(len-oldRem):null})}saveLeg()}
  $('stats').innerHTML='<b>'+fmt(len)+'</b> · about '+Math.max(1,Math.round(len/6.3/60))+' min · '+(mode==='scooter'?'scooter rules':'e-bike rules')+(why==='off'?' · <span style="color:var(--warn)">rerouted in '+(ms/1000).toFixed(1)+' s</span>':'');
  if(!riding){map.fitBounds(routeLine.getBounds(),{padding:[40,140]});$('start').style.display='';$('hint').style.display='';$('hint').textContent='Route ready. Tap Start ride.'}
  $('banner').classList.toggle('rr',why==='off');
  if(why==='off'){say('Rerouting. '+instr(steps[0]));setTimeout(()=>$('banner').classList.remove('rr'),2500)}
  if(riding)tick()}
$('start').onclick=async()=>{riding=true;if(leg&&!leg.t_start){leg.t_start=iso();if(leg.t_input)leg.handoff_s=Math.round((Date.parse(leg.t_start)-Date.parse(leg.t_input))/100)/10;saveLeg()}
  $('start').style.display='none';$('end').style.display='';$('hint').style.display='none';$('banner').style.display='block';try{await navigator.wakeLock?.request('screen')}catch(e){};map.setView(me,17);tick()};
function finish(arrived){riding=false;clearInterval(simTimer);$('end').style.display='none';if(leg){leg.t_end=iso();leg.arrived=arrived;saveLeg()}$('rate').style.display='block'}
$('end').onclick=()=>finish(false);
function rate(v){if(leg){leg.rating=v;saveLeg()}$('rate').style.display='none';$('banner').style.display='none';$('dest').value='';dest=null;route=null;steps=[];if(routeLine){map.removeLayer(routeLine);routeLine=null}if(destMarker){map.removeLayer(destMarker);destMarker=null}leg=null;$('stats').textContent='';$('hint').style.display='';$('hint').textContent='Logged. Paste the next address.'}
$('up').onclick=()=>rate('up');$('down').onclick=()=>rate('down');$('skip').onclick=()=>rate(null);
function tick(){if(!route||!me||!riding)return;
  if(hav(me,dest)<20){$('bdist').textContent='Arrived';$('binstr').textContent='You are at the destination';$('bthen').textContent='';say('You have arrived');finish(true);return}
  const off=nearestOnRoute(me).d;
  if(off>OFF_ROUTE_M){offCount++;if(offCount>=2&&!rerouting){rerouting=true;$('banner').classList.add('rr');$('bdist').textContent='Off route';$('binstr').textContent='Finding a way back…';$('bthen').textContent='';plan('off');return}}else offCount=0;
  if(rerouting)return;
  while(si<steps.length-1&&hav(me,steps[si].loc)<ADVANCE_M)si++;
  const s=steps[si],d=hav(me,s.loc);
  $('bdist').textContent=fmt(d);$('binstr').textContent=instr(s);$('bthen').textContent=steps[si+1]?'Then: '+instr(steps[si+1]):'';
  if(d<60)say(instr(s));
  map.panTo(me,{animate:true})}
// ---- log panel ----
function logSummary(){const L2=legs().filter(x=>x.t_start);const h=L2.map(x=>x.handoff_s).filter(x=>x!=null).sort((a,b)=>a-b);const up=L2.filter(x=>x.rating==='up').length,dn=L2.filter(x=>x.rating==='down').length;const rr=L2.reduce((a,x)=>a+x.reroutes.length,0);
  $('logsum').innerHTML='<b>'+L2.length+' legs logged</b><br>Median paste to start: '+(h.length?h[Math.floor(h.length/2)]+' s':'none yet')+'<br>Reroutes: '+rr+' · 👍 '+up+' · 👎 '+dn}
$('log').onclick=()=>{logSummary();$('logp').style.display='block'};$('logx').onclick=()=>$('logp').style.display='none';
$('clr').onclick=()=>{if(confirm('Clear all logged legs?')){localStorage.removeItem(LOG);logSummary()}};
$('exp').onclick=async()=>{const data=JSON.stringify({exported:iso(),app:'scootnav v0.1',legs:legs()},null,2);const name='scootnav-legs-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([data],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove()};
// ---- simulator for demos and desk tests ----
$('sim').onclick=()=>{if(!route)return;if(!riding)$('start').click();clearInterval(simTimer);let i=0,f=0;
  simTimer=setInterval(()=>{if(!route||rerouting)return;const c=route.ll;if(window._simJump){window._simJump=false;const n=nearestOnRoute(me);i=Math.max(0,n.i-1);f=0}if(i>=c.length-1){clearInterval(simTimer);return}
    const a=c[i],b=c[i+1],seg=hav(a,b)||1;f+=6/seg;while(f>=1&&i<c.length-2){f-=1;i++}
    const A=c[i],B=c[i+1],p=[A[0]+(B[0]-A[0])*Math.min(f,1),A[1]+(B[1]-A[1])*Math.min(f,1)];
    const h=Math.atan2((B[1]-A[1])*Math.cos(rad(A[0])),B[0]-A[0])*180/Math.PI;setMe(p,h)},600)};
$('miss').onclick=()=>{if(!me||!route)return;clearInterval(simTimer);
  const s=steps[si],c=route.ll,j=Math.max(1,s.idx),A=c[j-1],B=c[j];const h=Math.atan2((B[1]-A[1])*Math.cos(rad(A[0])),B[0]-A[0])*180/Math.PI;
  const p=ahead(s.loc,h,70);setMe(p,h);setTimeout(()=>setMe([p[0]+1e-5,p[1]],h),300);window._missAt=performance.now()};
window._sn={legs,get route(){return route},get steps(){return steps},get leg(){return leg}};
</script>
</body>
</html>
